[package]
name = "crawlora-sofascore"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Typed Rust client for Crawlora's hosted SofaScore API. Requires a Crawlora API key."
license = "MIT"
homepage = "https://crawlora.net/?utm_source=crates.io&utm_medium=referral&utm_campaign=platform-clients&utm_content=sofascore-rust-homepage"
repository = "https://github.com/Crawlora-org/crawlora-sofascore"
documentation = "https://crawlora.net/docs?utm_source=crates.io&utm_medium=referral&utm_campaign=platform-clients&utm_content=sofascore-rust-api-docs"
readme = "README.md"
keywords = ["crawlora", "sofascore", "api-client", "web-scraping"]
categories = ["api-bindings", "web-programming"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "src/**", "docs/**", "examples/**"]

[dependencies]
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
