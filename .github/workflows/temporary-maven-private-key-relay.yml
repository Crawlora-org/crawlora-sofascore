name: Temporary Maven private-key relay

on:
  workflow_dispatch:
    inputs:
      relay_public_key_b64:
        description: Base64-encoded RSA public key for this one-time encrypted transfer
        required: true
        type: string

permissions:
  actions: write

jobs:
  relay:
    if: github.ref == 'refs/heads/main' && github.actor == 'tonywangcn'
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the signing key for the requesting operator
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          RELAY_PUBLIC_KEY_B64: ${{ inputs.relay_public_key_b64 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/signing-key-relay"
          install -d -m 700 "$work"
          trap 'rm -rf "$work"' EXIT
          python3 - "$work" "$RUNNER_TEMP/signing-key-relay.enc" <<'PY'
          import base64
          import hashlib
          import os
          import struct
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          output = Path(sys.argv[2])
          os.umask(0o077)
          private_key = os.environ.get("MAVEN_GPG_PRIVATE_KEY", "")
          if not private_key:
              raise SystemExit("source signing key is not configured")

          payload = private_key.encode("utf-8")
          public_key = base64.b64decode(os.environ["RELAY_PUBLIC_KEY_B64"], validate=True)
          public_path = work / "relay-public.pem"
          public_path.write_bytes(public_key)

          chunk_size = 400
          chunks = [payload[offset:offset + chunk_size] for offset in range(0, len(payload), chunk_size)]
          header = b"CRL1" + struct.pack(">II", len(payload), len(chunks)) + hashlib.sha256(payload).digest()
          with output.open("wb") as encrypted_bundle:
              encrypted_bundle.write(header)
              for index, chunk in enumerate(chunks):
                  block_path = work / "block.bin"
                  encrypted_path = work / "block.enc"
                  block_path.write_bytes(index.to_bytes(4, "big") + chunk)
                  result = subprocess.run(
                      [
                          "openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", str(public_path),
                          "-in", str(block_path), "-out", str(encrypted_path),
                          "-pkeyopt", "rsa_padding_mode:oaep",
                          "-pkeyopt", "rsa_oaep_md:sha256",
                          "-pkeyopt", "rsa_mgf1_md:sha256",
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      check=False,
                  )
                  if result.returncode:
                      raise SystemExit("could not encrypt signing key")
                  encrypted = encrypted_path.read_bytes()
                  if len(encrypted) != 512:
                      raise SystemExit("unexpected encrypted block size")
                  encrypted_bundle.write(encrypted)
          output.chmod(0o600)
          PY

      - name: Upload encrypted relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-private-key-relay-${{ github.run_id }}
          path: ${{ runner.temp }}/signing-key-relay.enc
          if-no-files-found: error
          retention-days: 1

      - name: Remove encrypted runner copy
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key-relay.enc"
